[project]
name = "stock_data"
version = "0.1.0"
description = "Daily utility that collects stock information, indicators, and recent price/volume history for most US equities."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alpaca-py",
    "pandas-stubs~=3.0.3",
    "python-dotenv",
    "yfinance>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stock_data"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live-API tests are opt-in: `uv run pytest -m network`.
addopts = "-m 'not network'"
markers = [
    "network: hits live external APIs (Alpaca, Yahoo); excluded by default",
]
